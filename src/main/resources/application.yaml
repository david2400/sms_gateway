# ============================================================
# Configuración de Proveedores SMS
# Cambia el proveedor actual modificando 'sms.routing.primary'
# ============================================================
sms:
  routing:
    strategy: FAILOVER
    primary: inalambria
    fallback:
      - mock
      - go4clients
    health-check:
      enabled: true
      interval-seconds: 60

  providers:
    inalambria:
      enabled: true
      name: Inalambria
      description: Inalambria SMS Provider
      username: ${INALAMBRIA_USERNAME:COMFENALCOquindioOTP}
      password: ${INALAMBRIA_PASSWORD:c0qU1IO}
      base-url: https://restaws.inalambria.com
      timeout-seconds: 30
      max-retries: 3

    go4clients:
      enabled: true
      name: Go4Clients
      description: Go4Clients Cloud API
      api-key: ${GO4CLIENTS_API_KEY:4b3058ead56541539592bcb891c5bde4}
      api-secret: ${GO4CLIENTS_API_SECRET:0051518486296435}
      base-url: https://cloud.go4clients.com:8580/api
      sender: ${GO4CLIENTS_SENDER:RANDOM}
      timeout-seconds: 30
      max-retries: 3

    mock:
      enabled: true
      name: Mock
      description: Mock Provider for testing
      base-url: https://mock.local
      timeout-seconds: 5
      max-retries: 1

