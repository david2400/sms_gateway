spring:
  application:
    name: SMS_Gateway
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    jdbc-url: jdbc:sqlserver://${IP_BD_SQL_SERVER:localhost:1433};databaseName=MAESTRA;encrypt=false;trustServerCertificate=true
    username: ${USER_BD}
    password: ${PASS_BD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: auto
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2008Dialect
        jdbc:
          time_zone: America/Bogota
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  cloud:
    config:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: notificaciones4@comfenalcoquindio.co
    password: gmpc zhdy ulze yypf
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 9002

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE}
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_INSTANCE}:8761/eureka

# ============================================================
# SMS multi-proveedor (módulo SmsCore)
# Proveedores, cuentas, rutas y log viven en BD (ver src/main/resources/db/sms_core):
#   sms_proveedor, sms_cuenta, sms_ruta, sms_ruta_paso, sms_envio, sms_envio_intento
# Las contraseñas NO van en BD: sms_cuenta.secret_ref es el nombre de la variable
# de entorno (ej. INALAMBRIA_OTP_PASSWORD, GO4CLIENTS_API_SECRET).
# ============================================================
sms:
  core:
    routing-cache-ttl-seconds: 60

  # Servicio externo de usuarios (actualización de PIN en /otp/send-with-pin)
  usuario-service:
    base-url: ${USUARIO_SERVICE_URL:}
    guardar-endpoint: /api/login/usuarios/guardar
    connect-timeout-seconds: 10
    read-timeout-seconds: 30

# ============================================================
# Configuración de Proveedores Email
# ============================================================
email:
  routing:
    strategy: FAILOVER
    primary: sendgrid
    fallback:
      - javamail
    health-check:
      enabled: true
      interval-seconds: 60

  sendgrid:
    enabled: true
    api-key: ${SENDGRID_API_KEY:SG.xxxxxxxxxx.yyyyyyyyyy.zzzzzzzzz}
    from-email: ${SENDGRID_FROM_EMAIL:notificaciones4@comfenalcoquindio.co}
    from-name: ${SENDGRID_FROM_NAME:Comfenalco}
    sandbox: false

  javamail:
    enabled: true
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:notificaciones4@comfenalcoquindio.co}
    password: ${EMAIL_PASSWORD:gmpc zhdy ulze yypf}
    protocol: smtp
    auth: true
    starttls: true
    encoding: UTF-8

  mock:
    enabled: false
    log-emails: true
    simulate-delay: false
    delay-ms: 100

  smtp:
    host: smtp.gmail.com
    port: 587
    username: notificaciones4@comfenalcoquindio.co
    password: gmpc zhdy ulze yypf
    auth: true
    starttls:
      enable: true

  providers:
    # Configuración global
    global:
      timeout-seconds: 30
      max-retries: 3
      enable-circuit-breaker: true
      enable-retry: true
      default-sender: RANDOM
      enable-metrics: true
      enable-logging: true

# ============================================================
# Configuración de Logging
# ============================================================
logging:
  level:
    root: warn
    org.springframework.web: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    com.netflix.eureka: warn
    com.netflix.discovery: warn
    com.essenza.sms_gateway.modules.SmsCore: debug
    com.essenza.sms_gateway.modules.INALAMBRIA: debug
    com.essenza.sms_gateway.modules.Go4Clients: debug
    com.essenza.sms_gateway.modules.Mock: debug
    com.essenza.sms_gateway.modules.SmsAdmin: debug
  file:
    name: notificacion.log

# ============================================================
# Configuración de SpringDoc OpenAPI
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    try-it-out-enabled: true

# ============================================================
# Configuración de API externa
# ============================================================
api:
  servicios:
    url: ${URL_DOMINIO}
    puerto: ${PUERTO_DOMINIO}
    usuario: ApiService
    clave: 0000
    cedula: 00001

# ============================================================
# Información de aplicación
# ============================================================
aplicacion:
  descripcion: API REST Notificacion
  version: 1.0.0
  terminos-servicios: Terminos y condiciones
  contacto:
    nombre: Comfenalco Quindio
    email:
    url: https://www.comfenalcoquindio.com/
  licencia: Apache License Version 2.0
  licencia-url: https://www.apache.org/licenses/LICENSE-2.0
  id: 230

# ============================================================
# Configuración de archivos
# ============================================================
aplication:
  files:
    max-bytes: 8000000
