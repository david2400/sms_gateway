spring:
  application:
    name: SMS_Gateway
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    jdbc-url: jdbc:sqlserver://${IP_BD_SQL_SERVER:localhost:1433};databaseName=MAESTRA;encrypt=false;trustServerCertificate=true
    username: ${USER_BD}
    password: ${PASS_BD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: auto
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2008Dialect
        jdbc:
          time_zone: America/Bogota
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  cloud:
    config:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: notificaciones4@comfenalcoquindio.co
    password: gmpc zhdy ulze yypf
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 9002

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE}
  client:
