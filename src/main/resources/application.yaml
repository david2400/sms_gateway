spring:
  application:
    name: SMS_Gateway
  profiles:
    # Sin esto el bloque "on-profile: dev" de abajo no se activa y no hay datasource
    default: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # --- SQL Server (comentado: en desarrollo se usa MySQL local) ---
    # jdbc-url: jdbc:sqlserver://${IP_BD_SQL_SERVER:localhost:1433};databaseName=MAESTRA;encrypt=false;trustServerCertificate=true
    # username: ${USER_BD}
    # password: ${PASS_BD}
    # driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # --- MySQL local (servicio mysql8 en localhost:3306, base "notificacion") ---
    url: jdbc:mysql://localhost:3306/notificacion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Simonsito123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        # dialect: org.hibernate.dialect.SQLServer2008Dialect  # SQL Server; con MySQL se autodetecta
        jdbc:
          time_zone: America/Bogota
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  cloud:
    config:
      enabled: false
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 9002

# En dev no hay servidor Eureka local: se deshabilita el cliente para evitar
# los reintentos a localhost:8761. En producción quitar "enabled: false" y
# definir EUREKA_INSTANCE.
eureka:
  client:
    enabled: false
#    serviceUrl:
#      defaultZone: http://${EUREKA_INSTANCE}:8761/eureka
#  instance:
#    prefer-ip-address: true
#    ip-address: ${EUREKA_INSTANCE}

# ============================================================
# SMS multi-proveedor (módulo SmsCore)
# Proveedores, cuentas, rutas y log viven en BD (ver src/main/resources/db/sms_core):
#   sms_proveedor, sms_cuenta, sms_ruta, sms_ruta_paso, sms_envio, sms_envio_intento
# Las contraseñas NO van en BD: sms_cuenta.secret_ref es el nombre de la variable
# de entorno (ej. INALAMBRIA_OTP_PASSWORD, GO4CLIENTS_API_SECRET).
# ============================================================
sms:
  core:
    routing-cache-ttl-seconds: 60          # rutas y servicios por proveedor (SmsProveedorServicio)
    # Llave AES-256 (Base64, 32 bytes) para descifrar SmsCuenta.clave_cifrada. Solo por variable de entorno.
    crypto-key: ${SMS_CRYPTO_KEY:iJwYfk792WyGasoAbvty+2dD6f8KWH/lL1eHj4gnKfw=}

  # Módulo GestionPlatillas: plantillas SMS compiladas en caché
  plantillas:
    cache-ttl-seconds: 300

  # Inalambria - API REST masiva (POST /mtmessage/massive). Credenciales: las de la cuenta (SmsCuenta).
  # Por cuenta se puede sobrescribir con parametros_json: massiveUrl, massiveChunkSize, xAuth, notifyUrl.
  inalambria:
    massive:
      url: ${INALAMBRIA_MASSIVE_URL:https://rest.inalambria.com/mtmessage/massive}
      chunk-size: ${INALAMBRIA_MASSIVE_CHUNK_SIZE:500}
    # WhatsApp (plantillas de Meta). Por cuenta: parametros_json.whatsappUrl / source (o SmsCuenta.remitente)
    whatsapp:
      url: ${INALAMBRIA_WHATSAPP_URL:https://multichannel.inalambria.com/MultiChannelInput/SendMessageMetaWhatsApp}
    # SMS bidireccional desde código corto. Por cuenta: parametros_json.bidireccionalUrl / shortCode (o SmsCuenta.remitente)
    bidireccional:
      url: ${INALAMBRIA_BIDIRECCIONAL_URL:https://rest.inalambria.com/momessage}

  # Servicio externo de usuarios (actualización de PIN en /otp/send-with-pin)
  usuario-service:
    base-url: ${USUARIO_SERVICE_URL:}
    guardar-endpoint: /api/login/usuarios/guardar
    connect-timeout-seconds: 10
    read-timeout-seconds: 30

# ============================================================
# Configuración de Proveedores Email
# ============================================================
email:
  routing:
    strategy: FAILOVER
    primary: sendgrid
    fallback:
      - javamail
    health-check:
      enabled: true
      interval-seconds: 60

  sendgrid:
    enabled: true
    api-key: ${SENDGRID_API_KEY:SG.xxxxxxxxxx.yyyyyyyyyy.zzzzzzzzz}
    from-email: ${SENDGRID_FROM_EMAIL:notificaciones4@comfenalcoquindio.co}
    from-name: ${SENDGRID_FROM_NAME:Comfenalco}
    sandbox: false

  mock:
    enabled: false
    log-emails: true
    simulate-delay: false
    delay-ms: 100

#  smtp:
#    host: smtp.gmail.com
#    port: 587
#    username: notificaciones4@comfenalcoquindio.co
#    password: gmpc zhdy ulze yypf
#    auth: true
#    starttls:
#      enable: true

  providers:
    # Configuración global
    global:
      timeout-seconds: 30
      max-retries: 3
      enable-circuit-breaker: true
      enable-retry: true
      default-sender: RANDOM
      enable-metrics: true
      enable-logging: true

# ============================================================
# Configuración de Logging
# ============================================================
logging:
  level:
    root: warn
    org.springframework.web: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    com.netflix.eureka: warn
    com.netflix.discovery: warn
    com.essenza.sms_gateway.modules.SmsCore: debug
    com.essenza.sms_gateway.modules.INALAMBRIA: debug
    com.essenza.sms_gateway.modules.Go4Clients: debug
    com.essenza.sms_gateway.modules.Mock: debug
    com.essenza.sms_gateway.modules.SmsAdmin: debug
  file:
    name: notificacion.log

# ============================================================
# Configuración de SpringDoc OpenAPI
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    try-it-out-enabled: true

